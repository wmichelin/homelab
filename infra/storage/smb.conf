[global]
   workgroup = WORKGROUP
   server string = G5 Storage
   netbios name = G5-Storage
   security = user
   map to guest = never
   server role = standalone server
   smb ports = 445
   min protocol = SMB2
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   logging = systemd

[storage]
   path = /mnt/storage
   browseable = yes
   read only = no
   valid users = wmichelin
   force user = wmichelin
   force group = wmichelin
   create mask = 0644
   directory mask = 0755


[safe]
   path = /mnt/storage/safe
   browseable = yes
   read only = no
   valid users = wmichelin
   force user = wmichelin
   force group = wmichelin
   create mask = 0644
   directory mask = 0755
[tm-walter]
   path = /mnt/tm/walter
   browseable = yes
   read only = no
   valid users = wmichelin
   force user = wmichelin
   force group = wmichelin
   vfs objects = catia fruit streams_xattr
   fruit:time machine = yes

[tm-marissa]
   path = /mnt/tm/marissa
   browseable = yes
   read only = no
   valid users = marissa
   force user = marissa
   force group = marissa
   vfs objects = catia fruit streams_xattr
   fruit:time machine = yes

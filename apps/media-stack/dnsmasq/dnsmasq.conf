# LAN DNS for *.g5.lan → this host (G5 Caddy on :80).
#
# Intended as the LAN's DNS via eero Custom DNS → 192.168.0.54
# (eero has no local rewrite/host-map feature).
# Answers g5.lan locally; forwards everything else to public resolvers.
# Do not forward to the eero (192.168.0.1) — that can loop once DHCP points at us.

domain-needed
bogus-priv
no-resolv
no-hosts
keep-in-foreground

server=1.1.1.1
server=1.0.0.1
server=8.8.8.8

# g5.lan and every subdomain → G5
address=/g5.lan/192.168.0.54

listen-address=0.0.0.0
bind-interfaces

# Cache a bit so a brief blip does not hammer upstream
cache-size=1000

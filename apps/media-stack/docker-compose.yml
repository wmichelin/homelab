services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./config/jellyfin:/config
      - /mnt/storage/media:/media
      - /mnt/storage/safe/Photos:/photos:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    group_add:
      - "44"   # video
      - "992"  # render if present — may warn
    devices:
      - /dev/dri:/dev/dri

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr:/config
      # Single disk mount so /data/media ↔ /data/torrents hardlinks work (instant imports)
      - /mnt/disks/disk-hdd22:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - ./config/sonarr:/config
      # Same disk as Radarr/qBit so /data/media/tv ↔ /data/torrents hardlinks work
      - /mnt/disks/disk-hdd22:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - ./config/lidarr:/config
      - /mnt/disks/disk-hdd22:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    # Bridge + env-mapped BT port so Radarr can reach qBit by service DNS.
    # proton-qbit-port-forward.sh recreates this service when QBIT_BT_PORT changes.
    ports:
      - "8080:8080"
      - "${QBIT_BT_PORT:-6881}:${QBIT_BT_PORT:-6881}"
      - "${QBIT_BT_PORT:-6881}:${QBIT_BT_PORT:-6881}/udp"
    volumes:
      - ./config/qbittorrent:/config
      # complete/ stays on HDD for seeding + Radarr hardlinks; incomplete scratches on NVMe
      - /mnt/disks/disk-hdd22/torrents:/downloads
      - /var/lib/qbittorrent/incomplete:/downloads/incomplete
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
      - WEBUI_PASSWORD=${WEBUI_PASSWORD}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    volumes:
      - ./config/prowlarr:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York

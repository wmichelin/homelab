services:
  jellyfin:
    # Pinned to 12.0 RC after upgrade; revisit when 12.0 final ships.
    image: jellyfin/jellyfin:12.0-rc4
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./config/jellyfin:/config
      - /mnt/storage/media:/media
      - /mnt/storage/safe/Photos:/photos:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    group_add:
      - "44"   # video
      - "990"  # render (G5)
    devices:
      - /dev/dri:/dev/dri

  # Virtual Live TV for Jellyfin (HDHR + XMLTV). https://tunarr.com
  # RTX 2060 via NVIDIA Container Toolkit for CUDA/NVENC (faster channel zaps).
  # GPU healthcheck + autoheal: Docker GPU attach can go stale; restart re-binds it.
  tunarr:
    image: chrisbenincasa/tunarr:latest
    container_name: tunarr
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config/tunarr:/config/tunarr
    environment:
      - TZ=America/New_York
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    gpus: all
    group_add:
      - "44"   # video
      - "990"  # render (G5)
    devices:
      - /dev/dri:/dev/dri
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi -L | grep -q GPU"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 45s

  # Restarts containers labeled autoheal=true when their HEALTHCHECK fails.
  # https://github.com/willfarrell/docker-autoheal
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - TZ=America/New_York
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    network_mode: none

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr:/config
      # Single disk mount so /data/media ↔ /data/torrents hardlinks work (instant imports)
      - /mnt/disks/disk-hdd22:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - ./config/sonarr:/config
      # Same disk as Radarr/qBit so /data/media/tv ↔ /data/torrents hardlinks work
      - /mnt/disks/disk-hdd22:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - ./config/lidarr:/config
      - /mnt/disks/disk-hdd22:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    # Host net so BitTorrent can bind to proton0 (VPN kill switch).
    # WebUI is on host :8080; Caddy reaches it via host.docker.internal.
    # BT listen port is set by proton-qbit-port-forward.sh (no Docker publish).
    network_mode: host
    volumes:
      - ./config/qbittorrent:/config
      # Same HDD for incomplete + complete so finish is a rename (no NVMe fill-up).
      # /downloads/incomplete is a subdir of the torrents mount (no separate bind).
      - /mnt/disks/disk-hdd22/torrents:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
      - WEBUI_PASSWORD=${WEBUI_PASSWORD}

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    restart: unless-stopped
    ports:
      - "6789:6789"
    volumes:
      - ./config/nzbget:/config
      # Same HDD as torrents/media so *arr hardlinks work after remote path map.
      - /mnt/disks/disk-hdd22/usenet:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - NZBGET_USER=${NZBGET_USER:-nzbget}
      - NZBGET_PASS=${NZBGET_PASS}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    volumes:
      - ./config/prowlarr:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    depends_on:
      - flaresolverr

  # Cloudflare / DDoS-GUARD bypass for Prowlarr indexers (internal only).
  # Prowlarr → Settings → Indexers → FlareSolverr proxy → http://flaresolverr:8191
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - TZ=America/New_York
    # No host ports — only reachable on the compose network from Prowlarr.

  # Media discovery + request management for Jellyfin/Radarr/Sonarr. https://seerr.dev
  # Successor to Overseerr/Jellyseerr. Runs as non-root (UID 1000) and no longer ships
  # its own init process, so init: true is required. Config lives at /app/config.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    ports:
      - "5055:5055"
    volumes:
      - ./config/seerr:/app/config
    environment:
      - TZ=America/New_York
      - PORT=5055
    depends_on:
      - jellyfin
      - radarr
      - sonarr
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  # Reverse proxy: https://*.g5.lan (Tailscale MagicDNS → this host).
  # DNS/TLS: Headscale + Caddy internal CA — docs/headscale-tailscale.md
  caddy:
    image: caddy:2.10-alpine
    container_name: g5-caddy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_PASSWORD_HASH: ${OPENCODE_PASSWORD_HASH:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - jellyfin
      - tunarr
      - radarr
      - sonarr
      - lidarr
      - qbittorrent
      - nzbget
      - prowlarr
      - seerr

volumes:
  caddy-data:
  caddy-config:
